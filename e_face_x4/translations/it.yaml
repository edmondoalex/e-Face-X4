configuration:
  home_name:
    name: Nome abitazione
    description: Nome mostrato nella testata dell'interfaccia, ad esempio Casa, Villa o Ufficio.
  demo_mode:
    name: Modalità demo
    description: Mostra dati dimostrativi chiaramente identificati mentre si configura l'impianto.
  request_timeout_s:
    name: Timeout connettori
    description: Tempo massimo in secondi per attendere la risposta di un add-on collegato.
  nav_icons:
    name: Icone navigazione
    description: Icone Material Design mostrate nella barra principale.
    fields:
      watch:
        name: Guarda
      listen:
        name: Ascolta
      lights:
        name: Luci
      extra:
        name: Extra
      scenarios:
        name: Scenari
      covers:
        name: Oscuranti
      comfort:
        name: Comfort
      security:
        name: Sicurezza
  buspro:
    name: e-HDL BusPro MQTT
    description: Collegamento all'add-on che gestisce l'impianto BusPro.
    fields:
      enabled:
        name: Abilitato
      base_url:
        name: Indirizzo locale
        description: Indirizzo manuale di riserva; normalmente e-Face X4 rileva automaticamente l'add-on.
      token:
        name: Token
  evoice:
    name: Ekonex Media
    description: Collegamento locale automatico al componente e-Voice. I parametri API servono soltanto per il trasporto cloud alternativo.
    fields:
      enabled:
        name: Abilitato
      base_url:
        name: Indirizzo API cloud opzionale
      token:
        name: Credenziale Media cloud opzionale
      installation_id:
        name: ID impianto cloud opzionale
        description: Identificativo dell'impianto autorizzato nel backend Ekonex Media.
  etherm:
    name: e-Therm Plus KS
    description: Collegamento ai termostati e-Therm con stati e comandi in tempo reale.
    fields:
      enabled:
        name: Abilitato
      base_url:
        name: Indirizzo locale
        description: Indirizzo manuale di riserva; normalmente e-Face X4 rileva automaticamente l'add-on sulla porta 8080.
      auth_mode:
        name: Autenticazione
        description: Deve corrispondere a web_auth_mode configurato in e-Therm.
      username:
        name: Utente Basic
      password:
        name: Password Basic
      token:
        name: Token
        description: Compilare solo se e-Therm usa autenticazione token.

network:
  8099/tcp: Porta interfaccia web diretta
