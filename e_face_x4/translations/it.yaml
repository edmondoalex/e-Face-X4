configuration:
  home_name:
    name: Nome abitazione
    description: Nome mostrato nella testata dell'interfaccia, ad esempio Casa, Villa o Ufficio.
  demo_mode:
    name: Modalità demo
    description: Mostra dati dimostrativi chiaramente identificati mentre si configura l'impianto.
  request_timeout_s:
    name: Timeout connettori
    description: Tempo massimo in secondi per attendere la risposta di un add-on collegato.
  nav_icons:
    name: Icone navigazione
    description: Icone Material Design mostrate nella barra principale.
    fields:
      watch:
        name: Guarda
      listen:
        name: Ascolta
      lights:
        name: Luci
      extra:
        name: Extra
      covers:
        name: Oscuranti
      comfort:
        name: Comfort
      security:
        name: Sicurezza
  buspro:
    name: e-HDL BusPro MQTT
    description: Collegamento all'add-on che gestisce l'impianto BusPro.
    fields:
      enabled:
        name: Abilitato
      base_url:
        name: Indirizzo locale
        description: Indirizzo manuale di riserva; normalmente e-Face X4 rileva automaticamente l'add-on.
      token:
        name: Token
  evoice:
    name: e-Voice Multimedia
    description: Configurazione riservata al futuro connettore multimediale.
    fields:
      enabled:
        name: Abilitato
      base_url:
        name: Indirizzo API
      token:
        name: Token

network:
  8099/tcp: Porta interfaccia web diretta
