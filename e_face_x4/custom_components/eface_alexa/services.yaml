create_alarm:
  name: Crea sveglia Alexa
  description: Crea una sveglia Alexa direttamente da e-Face X4. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
    timestamp:
      required: true
      selector:
        datetime:
    recurrence:
      selector:
        select:
          options:
            - once
            - daily
create_timer:
  name: Crea timer Alexa
  description: Crea un timer Alexa direttamente da e-Face X4. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
    duration:
      required: true
      selector:
        duration:
    label:
      selector:
        text:
create_reminder:
  name: Crea promemoria Alexa
  description: Crea un promemoria Alexa direttamente da e-Face X4. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
    timestamp:
      required: true
      selector:
        datetime:
    label:
      required: true
      selector:
        text:
list_notifications:
  name: Elenca eventi Alexa
  description: Elenca sveglie, timer e promemoria Alexa. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
delete_notification:
  name: Elimina evento Alexa
  description: Elimina uno specifico evento Alexa. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
    notification_id:
      required: true
      selector:
        text:
delete_next_notification:
  name: Elimina il prossimo evento Alexa
  description: Elimina il prossimo evento Alexa del tipo scelto. Creato da Ekonex.it.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: alexa_devices
    kind:
      required: true
      selector:
        select:
          options:
            - alarm
            - timer
            - reminder
