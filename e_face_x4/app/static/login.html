<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi · e-Face X4</title><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#192226;color:#f4f7f8;font:16px system-ui,sans-serif}main{width:min(92vw,380px);padding:30px;border-radius:18px;background:#263136;box-shadow:0 20px 60px #0005}h1{margin:0 0 24px;font-size:24px}label{display:block;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #65777e;border-radius:8px;background:#182125;color:white;font:inherit}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:8px;background:#77eac1;color:#142820;font:700 16px system-ui;cursor:pointer}p{min-height:1.3em;color:#ffb6b6}
</style></head><body><main><h1>Accedi a e-Face</h1><form id="form"><label for="username">Utente</label><input id="username" value="admin" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>ACCEDI</button><p id="error" role="alert"></p></form></main><script>
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const error=document.getElementById('error');error.textContent='';const response=await fetch('api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})}).catch(()=>null);if(response?.ok)location.replace('./');else error.textContent='Accesso non riuscito';});
</script></body></html>
