<!doctype html>
<html lang="it"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263f48"><title>e-Face X4</title>
  <link rel="icon" type="image/png" href="assets/brand-icon.png"><link rel="apple-touch-icon" href="assets/brand-icon.png">
  <link rel="manifest" href="assets/manifest.webmanifest"><link rel="stylesheet" href="assets/app.css">
</head><body><div id="app" class="app loading" aria-live="polite">
  <header class="topbar">
    <div class="home-title"><img src="assets/brand-icon.png" alt="" class="mini-brand"><div><strong class="product-name">e-Face X4</strong><h1 id="home-name">Casa</h1><span id="mode">DEMO</span></div></div>
    <div class="clock"><strong id="clock">--:--</strong><span id="date">--</span></div><button class="more" aria-label="Menu">⋮</button>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="Navigazione principale">
      <button class="active" data-view="home"><b>⌂</b><span>Home</span></button><button data-view="rooms"><b>◇</b><span>Stanze</span></button>
      <button data-view="media"><b>♫</b><span>Media</span></button><button data-view="security"><b>⬡</b><span>Sicurezza</span></button>
      <button data-view="more"><b>▦</b><span>Altro</span></button>
    </nav>
    <main>
      <section class="status-strip">
        <button><i>⬡</i><span>Sicurezza</span><strong>OK</strong></button><button><i>✦</i><strong id="lights-count">7</strong><span>Luci</span></button>
        <button><i>❄</i><span id="weather">Comfort</span></button><button><i>▤</i><span>Cover</span></button><button><i>◌</i><span>Citofono</span></button>
      </section>
      <section class="dashboard-grid">
        <article class="climate-card xcard"><div><i>❄</i><span>Media<br><b>Raffrescamento</b></span></div><div class="temp-control"><button>−</button><strong id="temperature">22°</strong><button>＋</button></div></article>
        <section class="quick-grid" id="widgets"></section>
        <section class="camera-grid"><button class="camera garden"><span>Giardino</span></button><button class="camera pool"><span>Piscina</span></button><button class="camera patio"><span>Patio</span></button></section>
        <section class="room-panel xcard"><div class="panel-title"><span>Ambienti</span><button>Vedi tutti ›</button></div><div class="room-grid" id="rooms"></div></section>
      </section>
      <section class="now-playing xcard" id="media">
        <div class="cover"><span>♫</span></div><div class="track"><strong id="track-title">Nessuna riproduzione</strong><span id="track-detail">—</span><i><b></b><b></b><b></b></i></div>
        <div class="transport"><button>◁</button><button>◀</button><button class="play">Ⅱ</button><button>▶</button><button>▷</button></div>
        <div class="volume"><input id="volume" type="range" min="0" max="100" value="0"><strong id="volume-value">0%</strong></div>
      </section>
    </main>
  </div><div id="notice" class="notice" hidden></div>
</div><script type="module" src="assets/app.js"></script></body></html>
