      <button data-view="lights" title="Luci"><b class="nav-icon" data-icon="lights"></b><span>Luci</span></button>

    <main>
      <div id="home-view"><section class="dashboard-grid">
        <div class="home-overview-summary"><button class="home-security-summary security-safe" id="home-security-summary"><span class="home-security-state"><i id="home-security-icon" class="mdi-mask"></i><span><b id="home-security-state">Tutto sotto controllo</b></span></span><span class="home-security-mode"><small>MODALITÀ</small><strong id="home-security-mode">Disinserito</strong></span></button><button class="climate-card home-comfort-summary xcard comfort-idle" id="home-comfort-summary"><span class="comfort-state"><i id="home-comfort-icon" class="mdi-mask"></i><span><small>COMFORT</small><b id="home-comfort-state">Nessuna richiesta</b></span></span><span class="comfort-readings"><span><small>MEDIA INTERNA</small><strong id="home-comfort-inside">--</strong></span><i></i><span><small>ESTERNA</small><strong id="home-comfort-outside">--</strong></span></span></button></div>
        <section class="quick-grid state-summary-grid" id="widgets"></section>
        <section class="camera-grid" id="demo-cameras"><button class="camera garden"><span>Giardino</span></button><button class="camera pool"><span>Piscina</span></button><button class="camera patio"><span>Patio</span></button></section>

      </section><section class="home-live-media" id="home-live-media" hidden><header><span></span><strong>LIVE</strong><b id="home-live-media-count">0 SESSIONI</b></header><div id="home-live-media-list" class="home-live-media-list"></div></section></div>
      <section id="detail-view" class="detail-view" hidden>
        <header class="detail-header"><button id="detail-back" aria-label="Torna alla home">‹</button><div><h2 id="detail-title">Sezione</h2></div></header>
        <nav id="light-filters" class="light-filters" aria-label="Filtri luci" hidden><div class="room-filter"><button id="light-room-toggle" aria-expanded="false">Stanza</button><div id="light-room-menu" class="light-room-menu" hidden></div></div><button id="light-on-filter" class="light-state-filter" aria-label="Mostra solo le luci accese" title="Solo accesi" aria-pressed="false"><span></span></button><button id="light-all-filter" class="active">Tutto</button></nav>
        <nav id="av-filters" class="av-filters" aria-label="Selezione stanza" hidden><button id="av-room-toggle" aria-expanded="false"><span class="mdi-mask" style="--icon:url('api/icons/mdi/home-sound-out.svg')"></span><b id="av-room-label">Tutte le stanze</b><small>Scegli stanza</small></button><div id="av-room-menu" class="av-room-menu" hidden></div></nav>
        <section id="scenario-panel" class="scenario-panel" hidden><div class="scenario-heading"><div><strong>Scenari</strong><span>Richiami rapidi</span></div><button id="scenario-refresh">Aggiorna</button></div><div id="scenario-list" class="scenario-list"><span class="empty-state">Caricamento scenari…</span></div></section>
        <div id="device-list" class="device-list page-device-list"></div>
      </section>
      <section id="energy-view" class="energy-view" hidden><header class="detail-header"><button id="energy-back" aria-label="Indietro">‹</button><div><h2 id="energy-title">Dashboard energia</h2></div><button id="energy-reload" class="energy-reload" aria-label="Aggiorna dashboard" title="Aggiorna dashboard" hidden><span class="mdi-mask" style="--icon:url('api/icons/mdi/refresh.svg')"></span></button></header><div id="energy-picker" class="energy-picker"><div id="energy-dashboard-grid" class="energy-dashboard-grid"><span class="empty-state">Caricamento dashboard…</span></div></div><div id="energy-frame-shell" class="energy-frame-shell" hidden><iframe id="energy-frame" class="energy-frame" title="Dashboard Energia e-SunMind" loading="lazy" scrolling="no"></iframe></div></section>

  <dialog id="security-pin-dialog" class="security-pin-dialog"><form method="dialog" id="security-pin-form"><header><span></span><button type="button" id="security-pin-close" aria-label="Annulla">×</button></header><div class="security-pin-body"><p id="security-pin-operation"></p><label for="security-pin-input">Codice</label><input id="security-pin-input" type="password" inputmode="none" autocomplete="off" maxlength="16" readonly required aria-label="Codice di sicurezza"><div id="security-pin-keys" class="security-pin-keys"><button type="button" data-pin-key="1">1</button><button type="button" data-pin-key="2">2</button><button type="button" data-pin-key="3">3</button><button type="button" data-pin-key="4">4</button><button type="button" data-pin-key="5">5</button><button type="button" data-pin-key="6">6</button><button type="button" data-pin-key="7">7</button><button type="button" data-pin-key="8">8</button><button type="button" data-pin-key="9">9</button><button type="button" data-pin-key="clear" aria-label="Cancella tutto">C</button><button type="button" data-pin-key="0">0</button><button type="button" data-pin-key="back" aria-label="Cancella ultima cifra">⌫</button></div><small id="security-pin-error" role="alert"></small></div><footer><button type="button" id="security-pin-cancel">ANNULLA</button><button type="submit" id="security-pin-confirm">CONFERMA</button></footer></form></dialog>
</div><script type="module" src="assets/app.js?v=2.18.3"></script></body></html>
