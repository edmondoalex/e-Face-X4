<!doctype html>
<html lang="it"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263f48"><title>e-Face X4</title>
  <link rel="icon" type="image/png" href="assets/brand-icon.png"><link rel="apple-touch-icon" href="assets/brand-icon.png">
  <link rel="manifest" href="assets/manifest.webmanifest"><link rel="stylesheet" href="assets/app.css?v=2.0.1"><link rel="stylesheet" href="assets/media.css?v=2.0.1"><link rel="stylesheet" href="assets/media-x4.css?v=2.0.1">
</head><body><div id="app" class="app loading" aria-live="polite">
  <header class="topbar">
    <div class="home-title"><img src="assets/brand-horizontal.png?v=0.7.5" alt="EKONEX e-Face X4" class="horizontal-logo"><h1 id="home-name">Casa</h1><span id="mode">ANTEPRIMA DEMO</span></div>
    <div class="clock"><strong id="clock">--:--</strong><span id="date">--</span></div><button id="tools-open" class="more" aria-label="Strumenti">⋮</button>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="Navigazione principale">
      <button class="active" data-view="watch" title="Guarda"><b class="nav-icon" data-icon="watch"></b><span>Guarda</span></button>
      <button data-view="listen" title="Ascolta"><b class="nav-icon" data-icon="listen"></b><span>Ascolta</span></button>
      <button data-view="lights" title="Luci"><b class="nav-icon" data-icon="lights"></b><span>Luci</span></button>
      <button data-view="extra" title="Extra"><b class="nav-icon" data-icon="extra"></b><span>Extra</span></button>
      <button data-view="scenarios" title="Scenari"><b class="nav-icon" data-icon="scenarios"></b><span>Scenari</span></button>
      <button data-view="covers" title="Oscuranti"><b class="nav-icon" data-icon="covers"></b><span>Oscuranti</span></button>
      <button data-view="comfort" title="Comfort"><b class="nav-icon" data-icon="comfort"></b><span>Comfort</span></button>
      <button data-view="security" title="Sicurezza"><b class="nav-icon" data-icon="security"></b><span>Sicurezza</span></button>
    </nav>
    <main>
      <div id="home-view">
      <section class="status-strip">
        <button><i>⬡</i><span>Sicurezza</span><strong>OK</strong></button><button><i>✦</i><strong id="lights-count">7</strong><span>Luci</span></button>
        <button><i>❄</i><span id="weather">Comfort</span></button><button><i>▤</i><span>Cover</span></button><button id="provider-state"><i>◌</i><span>Connettori</span><strong>—</strong></button>
      </section>
      <section class="dashboard-grid">
        <article class="climate-card xcard"><div><i>❄</i><span>Media<br><b>Raffrescamento</b></span></div><div class="temp-control"><button>−</button><strong id="temperature">22°</strong><button>＋</button></div></article>
        <section class="quick-grid" id="widgets"></section>
        <section class="camera-grid" id="demo-cameras"><button class="camera garden"><span>Giardino</span></button><button class="camera pool"><span>Piscina</span></button><button class="camera patio"><span>Patio</span></button></section>
        <section class="room-panel xcard"><div class="panel-title"><span>Ambienti</span><button id="show-all-devices">Vedi tutti ›</button></div><div class="room-grid" id="rooms"></div></section>
      </section>
      <section class="now-playing xcard" id="media">
        <div class="cover"><span>♫</span></div><div class="track"><strong id="track-title">Nessuna riproduzione</strong><span id="track-detail">—</span><i><b></b><b></b><b></b></i></div>
        <div class="transport"><button>◁</button><button>◀</button><button class="play">Ⅱ</button><button>▶</button><button>▷</button></div>
        <div class="volume"><input id="volume" type="range" min="0" max="100" value="0"><strong id="volume-value">0%</strong></div>
      </section>
      </div>
      <section id="detail-view" class="detail-view" hidden>
        <header class="detail-header"><button id="detail-back" aria-label="Torna alla home">‹</button><div><h2 id="detail-title">Sezione</h2></div></header>
        <nav id="light-filters" class="light-filters" aria-label="Filtri luci" hidden><div class="room-filter"><button id="light-room-toggle" aria-expanded="false">Stanza</button><div id="light-room-menu" class="light-room-menu" hidden></div></div><button id="light-on-filter" class="light-state-filter" aria-label="Mostra solo le luci accese" title="Solo accesi" aria-pressed="false"><span></span></button><button id="light-all-filter" class="active">Tutto</button></nav>
        <nav id="av-filters" class="av-filters" aria-label="Selezione stanza" hidden><button id="av-room-toggle" aria-expanded="false"><span class="mdi-mask" style="--icon:url('api/icons/mdi/home-sound-out.svg')"></span><b id="av-room-label">Tutte le stanze</b><small>Scegli stanza</small></button><div id="av-room-menu" class="av-room-menu" hidden></div></nav>
        <section id="scenario-panel" class="scenario-panel" hidden><div class="scenario-heading"><div><strong>Scenari</strong><span>Richiami rapidi</span></div><button id="scenario-refresh">Aggiorna</button></div><div id="scenario-list" class="scenario-list"><span class="empty-state">Caricamento scenari…</span></div></section>
        <div id="device-list" class="device-list page-device-list"></div>
      </section>
    </main>
  </div><div id="notice" class="notice" hidden></div>
  <dialog id="rgb-dialog" class="rgb-dialog">
    <header><div><small>CONTROLLO RGB</small><h2 id="rgb-title">Luce RGB</h2></div><button id="rgb-close" aria-label="Chiudi">×</button></header>
    <div class="rgb-popup-body">
      <label class="rgb-master"><output id="rgb-master-value">0%</output><input id="rgb-master" type="range" min="1" max="255"></label>
      <div id="rgb-preview" class="rgb-preview"></div>
      <div id="rgb-wheel" class="rgb-wheel" role="slider" aria-label="Selettore colore"><i></i></div>
      <div id="rgb-palette" class="rgb-palette"></div>
      <div id="rgb-channel-controls" class="rgb-channel-controls"></div>
      <div class="rgb-popup-actions"><button data-popup-rgb-action="off">OFF</button><button data-popup-rgb-action="on">ON</button></div>
    </div>
  </dialog>
  <dialog id="media-zones-dialog" class="media-zones-dialog"><header><div><small>SESSIONE MULTIMEDIALE</small><h2>Aggiungi stanze</h2></div><button id="media-zones-close" aria-label="Chiudi">×</button></header><div class="zones-master" id="zones-master"></div><div id="media-zones-list" class="media-zones-list"></div><footer><button id="media-zones-save">FATTO</button></footer></dialog>
</div><script type="module" src="assets/app.js?v=2.0.1"></script></body></html>
