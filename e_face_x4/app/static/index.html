<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <title>e-Face X4</title>
  <link rel="icon" type="image/png" href="assets/brand-icon.png">
  <link rel="apple-touch-icon" href="assets/brand-icon.png">
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div id="app" class="app loading" aria-live="polite">
    <header class="topbar">
      <div class="identity">
        <img class="brand-symbol" src="assets/brand-icon.png" alt="e-Face X4">
        <div>
          <p class="eyebrow">e-Face X4</p>
          <h1 id="greeting">Buonasera</h1>
          <p class="context"><span id="home-name">Casa</span><i></i><span id="weather">—</span></p>
        </div>
      </div>
      <div class="top-actions">
        <span id="mode" class="mode">CARICAMENTO</span>
        <button class="round" id="theme" aria-label="Cambia tema">☼</button>
      </div>
    </header>

    <main>
      <section class="hero-grid" id="widgets"></section>

      <section class="section-heading">
        <div><p class="eyebrow">Ambienti</p><h2>Le tue stanze</h2></div>
        <button class="text-button">Mostra tutte <span>›</span></button>
      </section>
      <section class="room-grid" id="rooms"></section>

      <section class="media-panel" id="media">
        <div class="art"><div class="disc">♫</div></div>
        <div class="track">
          <p class="eyebrow">In riproduzione</p>
          <h2 id="track-title">Nessuna riproduzione</h2>
          <p id="track-detail">—</p>
        </div>
        <div class="transport" aria-label="Controlli multimediali">
          <button aria-label="Precedente">‹‹</button><button class="play" aria-label="Riproduci o pausa">Ⅱ</button><button aria-label="Successivo">››</button>
        </div>
        <div class="volume"><span>⌁</span><input id="volume" type="range" min="0" max="100" value="0" aria-label="Volume"><strong id="volume-value">0%</strong></div>
      </section>
    </main>

    <nav class="dock" aria-label="Navigazione principale">
      <button class="active" data-view="home"><b>⌂</b><span>Home</span></button>
      <button data-view="rooms"><b>◇</b><span>Stanze</span></button>
      <button data-view="media"><b>♫</b><span>Multimedia</span></button>
      <button data-view="security"><b>⬡</b><span>Sicurezza</span></button>
      <button data-view="more"><b>•••</b><span>Altro</span></button>
    </nav>
    <div id="notice" class="notice" hidden></div>
  </div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
