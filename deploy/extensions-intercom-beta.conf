; Beta site dialplan: individual Control4 T3 calls alongside existing group 8290.
[general]
static=yes

[default]
include => parkedcalls
exten => 444,1,Park(,s)
exten => 555,1,ParkedCall(default,701)
exten => 8290,1,Dial(PJSIP/control4-t3-ufficio-test&PJSIP/control4-t3-tavolo-test&PJSIP/8301,40)
exten => 8291,1,Dial(PJSIP/control4-t3-ufficio-test,40)
exten => 8292,1,Dial(PJSIP/control4-t3-tavolo-test,40)
; External station 1. Explicit URI uses the DoorBird P2P endpoint without a registration.
exten => 8201,1,Dial(PJSIP/doorbird-p2p-test/sip:192.168.2.30:5060,40)
exten => _X!,1,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})})

[doorbird-inbound]
exten => 8290,1,Goto(default,8290,1)

; The e-Face test phone may call the group or each Control4 tablet.
[eface-test]
exten => 8290,1,Goto(default,8290,1)
exten => 8291,1,Goto(default,8291,1)
exten => 8292,1,Goto(default,8292,1)
exten => 8201,1,Goto(default,8201,1)

[parkedcallstimeout]
exten => s,1,Hangup()
